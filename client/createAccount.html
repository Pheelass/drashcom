<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="/css/login.css">s
	<title>Drashcom - Login</title>
</head>
<body>
	<header>
		<h4>
			DRASHCOM<span id="span1">.</span><span id="span2">net</span>
		</h4>
	</header>
	<main>
		<div class="login">
			<img src="/content/favicon.png" alt="">
			<h2>Cria sua conta!</h2>

			<form method="POST" action="/login">
				<label for="username">username</label>
				<input type="email" id="username" autocomplete="current-username">
				<label for="password">password</label>
				<input type="password" id="password" autocomplete="current-password">
			</form>
			
			<button id="loginButton" type="submit">criar conta</button>
		</div>
	</main>
	<script src="/js/createAccount.js"></script>
</body>
</html>
